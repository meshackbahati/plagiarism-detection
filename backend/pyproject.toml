[tool.poetry]
name = "plagiarism-detection-backend"
version = "0.1.0"
description = "Production-grade backend for the plagiarism detection system."
authors = ["Jules"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core FastAPI and Web Server
fastapi = ">=0.120.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
gunicorn = ">=23.0.0"
pydantic-settings = ">=2.14.2"

# Database and ORM
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
alembic = "^1.12.1"
asyncpg = "^0.29.0"
pgvector = {extras = ["sqlalchemy"], version = "^0.2.0"}
"psycopg2-binary" = "^2.9.9"

# Asynchronous Tasks
celery = {extras = ["redis"], version = ">=5.6.0"}
redis = ">=6.1.0"

# Authentication and Security
passlib = {extras = ["argon2"], version = "^1.7.4"}
boto3 = "^1.28.57"
openai = "^1.6.0"

# File Handling and Parsing
python-multipart = ">=0.0.31"
"pdfminer.six" = ">=20251107"
"python-docx" = "^1.1.0"
pillow = ">=12.2.0"
numpy = ">=1.26"
email-validator = ">=2.1"
pytesseract = "^0.3.10"
pdf2image = "^1.17.0"

# Reporting and Monitoring
reportlab = "^4.0.7"
loguru = "^0.7.2"

[tool.poetry.group.ai.dependencies]
# AI/ML Models and Transformers
sentence-transformers = ">=5.6.0"
transformers = ">=5.10.0"
# CPU-only wheels: the default PyPI torch bundles ~3GB of CUDA libraries
# that this CPU-bound tool never uses.
torch = {version = ">=2.13.0", source = "pytorch-cpu"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
httpx = ">=0.27"
ruff = ">=0.8"
black = ">=26.10.1"
isort = ">=5.13"
mypy = "^1.7.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
